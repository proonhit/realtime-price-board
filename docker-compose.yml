x-backend-env: &backend-env
  DATABASE_URL: postgres://app:app@postgres:5432/priceboard?sslmode=disable
  REDIS_ADDR: redis:6379

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: priceboard
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d priceboard"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Chạy migrations một lần rồi thoát; api và producer chỉ khởi động khi bước này thành công.
  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./backend/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://app:app@postgres:5432/priceboard?sslmode=disable", "up"]
    depends_on:
      postgres: { condition: service_healthy }

  producer:
    build: { context: ./backend, args: { CMD: producer } }
    environment: *backend-env
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis:   { condition: service_healthy }

  api:
    build: { context: ./backend, args: { CMD: api } }
    environment: *backend-env
    restart: unless-stopped
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis:   { condition: service_healthy }

  web:
    build: ./web
    ports: ["3000:80"]
    depends_on: [api]

  redisinsight:
    image: redis/redisinsight:latest
    ports: ["5540:5540"]
    profiles: [tools]
    depends_on: [redis]

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["5050:80"]
    profiles: [tools]
    depends_on: [postgres]

volumes:
  pgdata:
